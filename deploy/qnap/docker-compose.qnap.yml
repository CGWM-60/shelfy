services:
  api:
    container_name: shelfy-api
    build:
      context: ${SHELFY_SRC_PATH:-/share/Container/shelfy}
      dockerfile: deploy/qnap/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HTTP_ADDR: :18080
      CONFIG_FILE: ${CONFIG_FILE:-}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_DSN: ${DB_DSN:-/data/shelfy.db}
      STORAGE_PATH: ${STORAGE_PATH:-/data/downloads}
      MEDIA_PATHS: ${MEDIA_PATHS:-/data/downloads,/media}
      DOWNLOAD_MAX_CONCURRENT: ${DOWNLOAD_MAX_CONCURRENT:-3}
      DOWNLOAD_AUTO_RESUME: ${DOWNLOAD_AUTO_RESUME:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_TOP_K: ${AI_TOP_K:-5}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-mistral-embed}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-small-latest}
      DEBRIDLINK_API_BASE: ${DEBRIDLINK_API_BASE:-https://debrid-link.com}
      DEBRIDLINK_OAUTH_CLIENT_ID: ${DEBRIDLINK_OAUTH_CLIENT_ID:-}
      DEBRIDLINK_OAUTH_CLIENT_SECRET: ${DEBRIDLINK_OAUTH_CLIENT_SECRET:-}
      DEBRIDLINK_OAUTH_SCOPE: ${DEBRIDLINK_OAUTH_SCOPE:-get.account get.post.delete.downloader get.files get.post.stream}
      FILESERVER_ENABLED: ${FILESERVER_ENABLED:-true}
      FILESERVER_AUTH_USER: ${FILESERVER_AUTH_USER:-}
      FILESERVER_AUTH_PASS: ${FILESERVER_AUTH_PASS:-}
      DLNA_ENABLED: ${DLNA_ENABLED:-true}
      DLNA_BASE_URL: ${DLNA_BASE_URL:-http://192.168.1.200:8080}
      SMB_ENABLED: ${SMB_ENABLED:-false}
      SMB_SHARE_NAME: ${SMB_SHARE_NAME:-shelfy}
      SMB_SHARE_PATH: ${SMB_SHARE_PATH:-/data/downloads}
      SMB_BINARY: ${SMB_BINARY:-smbd}
      SMB_STATUS_BINARY: ${SMB_STATUS_BINARY:-smbstatus}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
    volumes:
      - ${QNAP_APP_DATA_PATH:-/share/Container/shelfy/data}:/data
      - ${QNAP_MEDIA_PATH:-/share/Media}:/media:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    restart: unless-stopped

  worker:
    container_name: shelfy-worker
    build:
      context: ${SHELFY_SRC_PATH:-/share/Container/shelfy}
      dockerfile: deploy/qnap/Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:-prod}
      HTTP_ADDR: :18080
      CONFIG_FILE: ${CONFIG_FILE:-}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_DSN: ${DB_DSN:-/data/shelfy.db}
      STORAGE_PATH: ${STORAGE_PATH:-/data/downloads}
      MEDIA_PATHS: ${MEDIA_PATHS:-/data/downloads,/media}
      DOWNLOAD_MAX_CONCURRENT: ${DOWNLOAD_MAX_CONCURRENT:-3}
      DOWNLOAD_AUTO_RESUME: ${DOWNLOAD_AUTO_RESUME:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_TOP_K: ${AI_TOP_K:-5}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-mistral-embed}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-small-latest}
      DEBRIDLINK_API_BASE: ${DEBRIDLINK_API_BASE:-https://debrid-link.com}
      DEBRIDLINK_OAUTH_CLIENT_ID: ${DEBRIDLINK_OAUTH_CLIENT_ID:-}
      DEBRIDLINK_OAUTH_CLIENT_SECRET: ${DEBRIDLINK_OAUTH_CLIENT_SECRET:-}
      DEBRIDLINK_OAUTH_SCOPE: ${DEBRIDLINK_OAUTH_SCOPE:-get.account get.post.delete.downloader get.files get.post.stream}
      FILESERVER_ENABLED: ${FILESERVER_ENABLED:-true}
      FILESERVER_AUTH_USER: ${FILESERVER_AUTH_USER:-}
      FILESERVER_AUTH_PASS: ${FILESERVER_AUTH_PASS:-}
      DLNA_ENABLED: ${DLNA_ENABLED:-true}
      DLNA_BASE_URL: ${DLNA_BASE_URL:-http://192.168.1.200:8080}
      SMB_ENABLED: ${SMB_ENABLED:-false}
      SMB_SHARE_NAME: ${SMB_SHARE_NAME:-shelfy}
      SMB_SHARE_PATH: ${SMB_SHARE_PATH:-/data/downloads}
      SMB_BINARY: ${SMB_BINARY:-smbd}
      SMB_STATUS_BINARY: ${SMB_STATUS_BINARY:-smbstatus}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
    volumes:
      - ${QNAP_APP_DATA_PATH:-/share/Container/shelfy/data}:/data
      - ${QNAP_MEDIA_PATH:-/share/Media}:/media:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      - api

  web:
    container_name: shelfy-web
    build:
      context: ${SHELFY_SRC_PATH:-/share/Container/shelfy}
      dockerfile: deploy/qnap/Dockerfile.web
    network_mode: host
    restart: unless-stopped
    depends_on:
      - api
